name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run that is still in progress; runs on main never are.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest

    # A throwaway Postgres next to the job. The image matches the local/prod one (pgvector, pg16).
    # Tests refuse to run against any database not named jobradar_test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Port 5432 here: the service container is published on the runner's localhost.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jobradar_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true # cache is keyed on uv.lock

      # uv reads .python-version, so CI uses the same Python as local development.
      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q --cov=app
