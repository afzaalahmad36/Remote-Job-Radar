[project]
name = "remote-job-radar"
version = "0.1.0"
description = "AI-powered remote job pipeline: ingest, extract, score and track applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
# An application, not a library: uv installs the dependencies but not `app` itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: bugbear (likely bugs), ASYNC: blocking calls inside async code.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
# These libraries ship no type hints; what they return is treated as Any and narrowed by us.
module = ["feedparser", "celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @task decorator is untyped, so the decorated functions look untyped to mypy. Only the
# decorator is affected: the functions' own bodies and signatures are still checked strictly.
module = ["app.tasks.jobs"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# "auto" lets async tests run without decorating each one with @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `import app` (the project isn't installed as a package).
pythonpath = ["."]
# No single test may take longer than this (pytest-timeout). A stuck test then fails with a stack
# trace instead of hanging the run (a Celery test once hung CI for hours). Applies to sync tests
# too, including the ones that start their own event loop with asyncio.run.
timeout = 60
# Print every thread's stack if a test is still running after this long: a warning shot at 50 s,
# before the 60 s limit above fails it.
faulthandler_timeout = 50

[tool.coverage.run]
# SQLAlchemy's async layer runs on greenlets; without this, coverage loses track of the lines
# that execute after an awaited query and reports them as untested.
concurrency = ["greenlet", "thread"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]
