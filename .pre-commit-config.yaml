# Local hooks run the tools through `uv run`, so pre-commit uses the exact versions pinned in
# uv.lock instead of a second, separately pinned copy of ruff/mypy.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # docker-compose.override.yml publishes the database port for local tooling. It is git-ignored;
      # this stops `git add -f` from sneaking it into a commit anyway.
      - id: no-compose-override
        name: docker-compose.override.yml must not be committed
        entry: docker-compose.override.yml is local only (see CLAUDE.md section 10)
        language: fail
        files: (^|/)docker-compose\.override\.ya?ml$
      # A real CV must never be committed. Rejects any PDF and any file named like a CV outside
      # tests/fixtures/cv (source files such as app/models/cv.py are fine). The same check also
      # runs in the test suite over every tracked file, so CI catches a skipped hook.
      - id: no-cv-files
        name: no CV-like files outside tests/fixtures/cv
        entry: uv run python -m scripts.check_no_cv_files
        language: system
        pass_filenames: true
