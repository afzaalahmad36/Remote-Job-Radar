# Local hooks run the tools through `uv run`, so pre-commit uses the exact versions pinned in
# uv.lock instead of a second, separately pinned copy of ruff/mypy.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
